[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agas"
version = "0.1.0"
description = "Adaptive General Athleticism System domain, planning, and execution foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "setuptools>=80",
  "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = [
  "packages/domain/src",
  "packages/safety/src",
  "packages/seed_data/src",
  "services/api/src",
  "services/evidence/src",
  "services/planner/src",
]
namespaces = false

[tool.setuptools.data-files]
"share/agas/data" = ["data/seed-manifest.json"]
"share/agas/data/adaptations" = ["data/adaptations/*.json"]
"share/agas/data/equipment" = ["data/equipment/*.json"]
"share/agas/data/evidence_seed" = ["data/evidence_seed/*.json"]
"share/agas/data/exercises" = ["data/exercises/*.json"]
"share/agas/data/synthetic_athletes" = ["data/synthetic_athletes/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
