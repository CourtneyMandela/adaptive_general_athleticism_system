services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agas
      POSTGRES_USER: agas
      POSTGRES_PASSWORD: agas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agas -d agas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agas-postgres:/var/lib/postgresql/data

volumes:
  agas-postgres:

