name: agas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agas
      POSTGRES_PASSWORD: ${AGAS_POSTGRES_PASSWORD:?set AGAS_POSTGRES_PASSWORD}
      POSTGRES_USER: agas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agas -d agas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agas-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: &api-environment
      AGAS_AUTH_MODE: external
      AGAS_CORS_ORIGINS: ${AGAS_CORS_ORIGINS:?set AGAS_CORS_ORIGINS}
      AGAS_DATABASE_URL: ${AGAS_DATABASE_URL:?set AGAS_DATABASE_URL}
      AGAS_ENVIRONMENT: production
      AGAS_EXTERNAL_AUTH_ALGORITHMS: ${AGAS_EXTERNAL_AUTH_ALGORITHMS:?set AGAS_EXTERNAL_AUTH_ALGORITHMS}
      AGAS_EXTERNAL_AUTH_AUDIENCE: ${AGAS_EXTERNAL_AUTH_AUDIENCE:?set AGAS_EXTERNAL_AUTH_AUDIENCE}
      AGAS_EXTERNAL_AUTH_ISSUER: ${AGAS_EXTERNAL_AUTH_ISSUER:?set AGAS_EXTERNAL_AUTH_ISSUER}
      AGAS_EXTERNAL_AUTH_JWKS_URL: ${AGAS_EXTERNAL_AUTH_JWKS_URL:?set AGAS_EXTERNAL_AUTH_JWKS_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AGAS_AUTH_MODE: session
    restart: unless-stopped
    environment:
      AGAS_INTERNAL_API_URL: ${AGAS_INTERNAL_API_URL:?set AGAS_INTERNAL_API_URL}
      AGAS_PUBLIC_WEB_ORIGIN: ${AGAS_PUBLIC_WEB_ORIGIN:?set AGAS_PUBLIC_WEB_ORIGIN}
      AGAS_SESSION_ENCRYPTION_KEY: ${AGAS_SESSION_ENCRYPTION_KEY:?set AGAS_SESSION_ENCRYPTION_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "127.0.0.1:${AGAS_WEB_LOOPBACK_PORT:-3000}:3000"

volumes:
  agas-postgres:
